apiVersion: v1
kind: Namespace
metadata: 
    name: netpol-lab

---

apiVersion: v1
kind: Pod
metadata: 
   name: server
   namespace: netpol-lab
   labels: 
      app: server

spec: 
   containers: 
      - name: nginx
        image: nginx
        ports:
          - containerPort: 80

---               

apiVersion: v1
kind: Service
metadata: 
   name: server-service
   namespace: netpol-lab
spec:
   selector:
       app: server
   ports: 
     - port: 80
       targetPort: 80 

---

apiVersion: v1
kind: Pod
metadata: 
   name: client
   namespace: netpol-lab
   labels: 
      app: client
spec: 
  containers:
      - name: busybox
        image: busybox
        command: ["sleep", "3600"]      

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
   name: deny-server-ingress
   namespace: netpol-lab 
spec: 
   podSelector: 
      matchLabels:
         app: server          

   policyTypes: 
      - Ingress
