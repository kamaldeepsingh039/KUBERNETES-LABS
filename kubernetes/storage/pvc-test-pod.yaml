apiVersion: v1
kind: Pod
metadata:
  name: pvc-test
spec:
  containers:
    - name: test-container
      image: busybox
      command: ["sleep", "3600"]
      volumeMounts:
        - name: test-storage
          mountPath: /data

  volumes:
    - name: test-storage
      persistentVolumeClaim:
        claimName: flask-pvc