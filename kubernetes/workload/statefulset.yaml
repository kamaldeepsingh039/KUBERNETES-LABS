apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stateful-app
spec:
  serviceName: stateful-app
  replicas: 2

  selector:
    matchLabels:
      app: stateful-app

  template:
    metadata:
      labels:
        app: stateful-app

    spec:
      containers:
        - name: stateful-container
          image: busybox
          command: ["sleep", "3600"]

          volumeMounts:
            - name: data
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi