apiVersion: apps/v1
kind: Deployment 
metadata:
  name: flask-app
spec:
   replicas: 4
   strategy: 
      type: RollingUpdate
      rollingUpdate: 
         maxUnavailable: 0
         maxSurge: 1
   selector:
     matchLabels:
       app: flask-app
   template:
      metadata:
         labels:
           app: flask-app 







      spec:

         affinity:
          nodeAffinity:
             requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                   - matchExpressions:
                      - key: kubernetes.io/os
                        operator: In
                        values: 
                           - linux

                  



         tolerations:
           - key: "dedicated"
             operator: "Equal"
             value: "dev"
             effect: "NoSchedule"         
         containers:
            - name: flask-app
              image: 082139776123.dkr.ecr.ca-central-1.amazonaws.com/docker-flask-app:latest
              imagePullPolicy: Always
              ports:
                - containerPort: 5000      

              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"    




              readinessProbe:
                httpGet:
                   path: /health
                   port: 5000
                initialDelaySeconds: 5
                periodSeconds: 10

              livenessProbe:
                httpGet:
                   path: /health
                   port: 5000
                initialDelaySeconds: 15
                periodSeconds: 20          
              volumeMounts:
                - name: config-volume
                  mountPath: /etc/flask-config

         volumes:
            - name: config-volume
              configMap:
                 name: flask-config


         topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule 
              labelSelector:
                matchLabels:
                   app: flask-app        